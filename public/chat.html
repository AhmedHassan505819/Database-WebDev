<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServeBot AI - Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="animated-background">
      <div class="gradient-sphere sphere-1"></div>
      <div class="gradient-sphere sphere-2"></div>
      <div class="gradient-sphere sphere-3"></div>
      <div class="glow-center"></div>
      <div class="grid-overlay"></div>
      <div class="noise-overlay"></div>
    </div>

    <canvas id="glitter-canvas"></canvas>

    <section id="auth-view" class="view active">
      <form
        class="glass-panel auth-box"
        onsubmit="
          event.preventDefault();
          handleAuth();
        "
      >
        <h2 id="auth-title">Welcome Back</h2>
        <p id="auth-subtitle">Sign in to track your orders.</p>

        <input
          type="email"
          id="auth-email"
          placeholder="Gmail Address"
          class="hidden"
        />
        <input
          type="text"
          id="auth-username"
          placeholder="Username"
          autocomplete="off"
        />
        <input
          type="text"
          id="auth-password"
          class="masked-password"
          placeholder="Password"
        />

        <button type="submit" id="auth-action-btn">Sign In</button>
        <p class="toggle-text">
          New here? <span onclick="toggleAuthMode()">Register</span>
        </p>
      </form>
    </section>

    <section id="intro-view" class="view">
      <div class="intro-container">
        <div id="intro-text" class="typewriter-text"></div>
        <div class="skip-hint">Press [Enter] to skip</div>
      </div>
    </section>

    <section id="chat-view" class="view">
      <div class="chat-layout">
        <aside class="sidebar glass-panel">
          <button
            class="close-sidebar-btn mobile-only"
            onclick="toggleSidebar()"
          >
            ✖
          </button>

          <button class="new-chat-btn" onclick="startNewChat()">
            + New Chat
          </button>
          <div class="history-list" id="history-list">
            <p
              style="color: var(--text-muted); font-size: 0.9rem; padding: 10px"
            >
              Loading history...
            </p>
          </div>
        </aside>

        <main class="chat-container glass-panel">
          <header class="chat-header">
            <button class="nav-btn mobile-only" onclick="toggleSidebar()">
              ☰
            </button>

            <div
              class="avatar"
              style="background: transparent; box-shadow: none; padding: 0"
            >
              <svg
                width="45"
                height="45"
                viewBox="0 0 64 64"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <defs>
                  <linearGradient
                    id="ai-grad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%"
                  >
                    <stop offset="0%" stop-color="#d81b60" />
                    <stop offset="100%" stop-color="#8e24aa" />
                  </linearGradient>
                  <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur" />
                    <feMerge>
                      <feMergeNode in="coloredBlur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>
                <path
                  d="M32 4L56 18V46L32 60L8 46V18L32 4Z"
                  stroke="url(#ai-grad)"
                  stroke-width="4"
                  fill="rgba(216, 27, 96, 0.15)"
                  filter="url(#glow)"
                />
                <circle cx="32" cy="32" r="10" fill="url(#ai-grad)" />
                <path
                  d="M32 16V22M32 42V48M16 32H22M42 32H48M20 20L25 25M39 39L44 44M20 44L25 39M39 25L44 20"
                  stroke="url(#ai-grad)"
                  stroke-width="3"
                  stroke-linecap="round"
                />
              </svg>
            </div>

           <div class="header-actions">
                        <button onclick="switchView('admin-view'); fetchInventory(); setTimeout(() => loadAnalytics(), 100);" class="nav-btn admin-link hidden" id="go-admin-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            <span class="action-text">Admin</span>
                        </button>
                        <button onclick="logout()" class="nav-btn logout-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            <span class="action-text">Logout</span>
                        </button>
                    </div>
          </header>

          <div class="chat-box" id="chat-box"></div>

          <div class="input-area">
            <input
              type="text"
              id="user-input"
              placeholder="Ask about items, inventory, or orders..."
              autocomplete="off"
            />
            <button id="send-btn">↑</button>
          </div>
        </main>
      </div>
    </section>

    <section id="admin-view" class="view">
      <div class="admin-layout">
        <header class="nav-header">
          <h2>👑 Admin Command Center</h2>
          <button onclick="switchView('chat-view')" class="btn-return">
            ⬅ Back to Chat
          </button>
        </header>

        <div class="analytics-container">
          <div class="stats-card glass-panel">
            <h3>Total Revenue</h3>
            <h2 id="total-revenue-stat">$0.00</h2>
          </div>
          <div class="stats-card glass-panel">
            <h3>Total Orders</h3>
            <h2 id="total-orders-stat">0</h2>
          </div>
          <div class="chart-card glass-panel">
            <canvas id="topCustomersChart"></canvas>
          </div>
        </div>

        <div class="glass-panel add-product-panel">
          <h3>Add New Inventory</h3>
          <div class="add-flex">
            <input type="text" id="new-item-name" placeholder="Product Name" />
            <input type="number" id="new-item-price" placeholder="Price ($)" />
            <input type="number" id="new-item-qty" placeholder="Quantity" />
            <button onclick="addNewProduct()" class="action-btn">
              Add Item
            </button>
          </div>
        </div>

        <div id="inventory-grid" class="grid-container"></div>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
